name: version_widget
description: A Flutter widget that displays version information with optional changelog date and link.
version: 2.0.0
repository: https://github.com/anusii/version_widget
homepage: https://github.com/anusii/version_widget

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  markdown_tooltip: ^1.0.0
  material_ui: ^1.11.0
  url_launcher: ^6.1.14
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
